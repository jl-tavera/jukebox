name: site

# Path-filtered so touching the API or the CLI never runs the site's checks, and
# so shipping the landing page never reaches either of them.
#
# The wordmark this page renders is generated, not written here. Since #60 the
# banner at the top of `docs/design/DESIGN.md` is the source, and cli.yml
# regenerates both copies and diffs them -- naming `site/lib/content.ts` and
# that document in its own path filter, so an edit to either still reaches the
# check. It runs there rather than here, once rather than twice, the same split
# the schema checks already use.
#
# The art is not edited in `site/lib/content.ts` at all any more: an edit there
# is one CI will undo. Change the document and run the generator.
#
# `cli/package.json` is named for the mirror of that reason. Since #82 the boot
# on the landing page prints `jukebox <version>` read from that file, the way
# `cli/src/version.ts` reads it -- so a release bump changes what this page
# renders, and without naming the file here it would change it without ever
# running these checks. One file rather than `cli/**`, so the rest of the CLI's
# churn still stays out; the same shape cli.yml uses in the other direction.
#
# GitHub Actions does not expand YAML anchors, so the list is written twice.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'schema/**'
      - 'cli/package.json'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - 'site/**'
      - 'schema/**'
      - 'cli/package.json'
      - '.github/workflows/site.yml'
      - 'package.json'
      - 'bun.lock'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bun run --cwd site typecheck

      # The session module, driven directly. #82 brought `bun test` here for it:
      # the module is pure -- no DOM, no timers, no clipboard -- so it runs in
      # milliseconds and needs no browser. `typecheck` above compiles it a
      # second time with Bun's types and no DOM lib, which turns the DOM half of
      # that into a compiler error; timers are not reachable that way, because
      # Bun declares `setTimeout` itself. See site/tsconfig.test.json.
      #
      # What needs pixels is not here and must not drift here: five wordmark
      # rows measuring the same width, focus against hover, touch targets and
      # contrast are #83's Playwright harness.
      - run: bun run --cwd site test

      # The first workflow here that builds, because what needs checking is the
      # build's output rather than its source. The discovery document is read
      # back from `out/` and not `public/`, so a build that quietly stopped
      # publishing it fails here instead of in a CLI on somebody's machine.
      #
      # The parser doing the checking is unit-tested by the worker's workflow,
      # which is filtered on schema/** too -- so it is covered once rather than
      # three times, the same split cli.yml already carries a note about.
      #
      # Nothing here notices a CLI version bump that leaves min_version naming a
      # release nobody can install. That is deliberate: DESIGN.md 07's
      # breaking-change procedure is what keeps the two in step, and it is an
      # ordering a workflow cannot check.
      - run: bun run --cwd site build
      - run: bun run --cwd site check:discovery

      # Both installers, read back from `out/` for the same reason. This one is
      # mostly about line endings: a CRLF install.sh fails on its own shebang,
      # and the export is built from the working tree rather than from git, so
      # `.gitattributes` alone cannot guarantee what gets deployed. See
      # scripts/check-installers.ts.
      - run: bun run --cwd site check:installers

      # Both webfonts, read back from `out/` on the same reasoning again -- and
      # here it is the reasoning ADR-0010 leaned on when it gave up SITE.md 03's
      # no-webfont guarantee. The wordmark is built entirely from Block
      # Elements, a default latin subset drops every one of them, and the
      # per-glyph fallback that replaces them shears the art apart silently, on
      # somebody else's machine rather than on the one that built the page. A
      # correct public/fonts/*.woff2 that never gets copied is a sheared
      # wordmark, so this reads the export.
      #
      # It does not subset anything. The .woff2 files are committed artefacts,
      # written by `bun run --cwd site fonts:build`, which reaches the network
      # and shells out to fontTools and is run by hand. That is what keeps this
      # workflow on one runtime: the check needs nothing installed, because
      # scripts/woff2.ts reads the cmap out of the bytes itself.
      #
      # Nothing here proves the glyphs render at the right width -- a code point
      # in a cmap is not an advance width. That is #83's Playwright harness, and
      # it must not drift here.
      - run: bun run --cwd site check:fonts

      # And here it is: the third of the three things ADR-0010 traded SITE.md
      # 03's no-webfont guarantee for. The step above proves the shipped faces
      # still carry every Block Element; this one proves the browser draws them
      # at the same advance the spaces beside them get. A face can satisfy the
      # first and fail the second, and the art shears silently when it does.
      #
      # **This installs a browser, which nothing else in this repo does.** Every
      # other step here runs on the one runtime `setup-bun` provides, and the
      # comment above says needing nothing installed is a virtue. It is, and
      # this is the exception worth buying: an advance width is not a fact about
      # a file, it is a fact about rendering, and there is no way to read one
      # without something that renders. Chromium only, so it is one download
      # rather than three -- `playwright.config.ts` makes a second engine a line
      # in an array if that is ever wanted.
      #
      # It runs last because it is the slowest step and needs `out/` from the
      # build above -- `playwright.config.ts` serves the export through
      # `wrangler dev`, the same asset path production uses, because a test of
      # the shipped font has no business reading `public/`.
      - run: bun run --cwd site e2e:install
      - run: bun run --cwd site test:e2e

